name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install
        run: |
          npm ci
          npm --prefix client ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Chat module tests (TypeScript)
        run: npm test

      - name: Game rules tests (itb)
        run: node itb/tools/test-rules.js

      - name: Game server and protocol tests (itb)
        run: node itb/tools/test-net.js

      - name: Client build
        run: npm run client:build
